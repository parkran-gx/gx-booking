{% extends 'base.html' %}
{% block title %}단지 관리{% endblock %}
{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <h3 class="fw-bold mb-0"><i class="fa-solid fa-building me-2"></i>단지 관리</h3>
  <a href="/complexes/create/" class="btn btn-gx btn-sm">
    <i class="fa-solid fa-plus me-1"></i>단지 추가
  </a>
</div>
{% for c in complexes %}
<div class="card gx-card mb-3">
  <div class="card-body p-3">
    <div class="d-flex justify-content-between align-items-center">
      <div>
        <h6 class="fw-bold mb-1">{{ c.name }}</h6>
        <small class="text-muted">코드: {{ c.code }} &nbsp;·&nbsp; {{ c.address }}</small>
      </div>
      <div class="d-flex gap-2 align-items-center">
        <span class="badge {% if c.is_active %}bg-success{% else %}bg-secondary{% endif %}">
          {% if c.is_active %}운영중{% else %}비활성{% endif %}
        </span>
        <a href="/complexes/{{ c.pk }}/edit/" class="btn btn-sm btn-outline-secondary">
          <i class="fa-solid fa-pen"></i>
        </a>
      </div>
    </div>
  </div>
</div>
{% empty %}
<div class="alert alert-info text-center">등록된 단지가 없습니다.</div>
{% endfor %}
{% endblock %}
