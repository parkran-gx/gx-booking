{% extends 'base.html' %}
{% block title %}새 비밀번호 설정{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card gx-card p-4">
      <h4 class="fw-bold mb-4"><i class="fa-solid fa-lock-open me-2"></i>새 비밀번호 설정</h4>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">새 비밀번호</label>
          <input type="password" name="password1" class="form-control" placeholder="8자 이상" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">새 비밀번호 확인</label>
          <input type="password" name="password2" class="form-control" placeholder="동일하게 입력" required>
        </div>
        <button type="submit" class="btn btn-gx w-100">
          <i class="fa-solid fa-check me-1"></i>비밀번호 변경
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
