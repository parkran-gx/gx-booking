{% extends 'base.html' %}
{% block title %}강사 로그인{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-4">
    <div class="card gx-card p-4">
      <h4 class="fw-bold text-center mb-4"><i class="fa-solid fa-lock me-2"></i>강사 로그인</h4>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">아이디</label>
          <input type="text" name="username" class="form-control form-control-lg" autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label">비밀번호</label>
          <input type="password" name="password" class="form-control form-control-lg">
        </div>
        {% if form.errors %}
        <div class="alert alert-danger small">아이디 또는 비밀번호가 올바르지 않습니다.</div>
        {% endif %}
        <button type="submit" class="btn btn-gx w-100 btn-lg">로그인</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
