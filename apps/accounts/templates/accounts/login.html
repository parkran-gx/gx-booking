{% extends 'base.html' %}
{% block title %}로그인{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-4">
    <div class="card gx-card p-4">
      <h4 class="fw-bold text-center mb-4"><i class="fa-solid fa-lock me-2"></i>로그인</h4>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">아이디</label>
          <input type="text" name="username" class="form-control form-control-lg" autofocus>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">비밀번호</label>
          <input type="password" name="password" class="form-control form-control-lg">
        </div>
        <button type="submit" class="btn btn-gx w-100 btn-lg">로그인</button>
        <div class="d-flex justify-content-between mt-3 small">
          <a href="/accounts/register/">회원가입</a>
          <a href="/accounts/password/reset/">비밀번호 찾기</a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
