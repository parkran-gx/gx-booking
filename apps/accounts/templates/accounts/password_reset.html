{% extends 'base.html' %}
{% block title %}비밀번호 찾기{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <div class="card gx-card p-4">
      <h4 class="fw-bold mb-1"><i class="fa-solid fa-key me-2"></i>비밀번호 찾기</h4>
      <p class="text-muted small mb-4">가입 시 등록한 아이디와 연락처로 확인합니다.</p>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">아이디</label>
          <input type="text" name="username" class="form-control" placeholder="가입한 아이디" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">연락처</label>
          <input type="tel" name="phone" class="form-control" placeholder="010-0000-0000" required>
        </div>
        <button type="submit" class="btn btn-gx w-100">
          <i class="fa-solid fa-magnifying-glass me-1"></i>확인
        </button>
        <p class="text-center mt-3 small"><a href="/accounts/login/">로그인으로 돌아가기</a></p>
      </form>
    </div>
  </div>
</div>
{% endblock %}
