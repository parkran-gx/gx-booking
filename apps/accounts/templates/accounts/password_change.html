{% extends 'base.html' %}
{% block title %}비밀번호 변경{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-5">
    <a href="/accounts/dashboard/" class="btn btn-link ps-0 mb-3"><i class="fa-solid fa-arrow-left me-1"></i>돌아가기</a>
    <div class="card gx-card p-4">
      <h4 class="fw-bold mb-4"><i class="fa-solid fa-key me-2"></i>비밀번호 변경</h4>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">현재 비밀번호</label>
          <input type="password" name="old_password" class="form-control" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">새 비밀번호</label>
          <input type="password" name="new_password1" class="form-control" placeholder="8자 이상" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">새 비밀번호 확인</label>
          <input type="password" name="new_password2" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-gx w-100">변경하기</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
