{% extends 'base.html' %}
{% block title %}쪽지 보내기 (관리자){% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-7">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <h4 style="font-size:1.1rem;font-weight:600;margin:0;">회원에게 쪽지 보내기</h4>
      <a href="/messages/inbox/" style="font-size:0.82rem;color:var(--mist);text-decoration:none;">
        <i class="fa-solid fa-inbox me-1"></i>수신함
      </a>
    </div>

    <div class="gx-card p-4">
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label">받는 회원 <span style="color:var(--rose);">*</span></label>
          <select name="target_user" class="form-select" required>
            <option value="">회원을 선택하세요</option>
            {% for m in members %}
            <option value="{{ m.user.id }}">
              {{ m.display_name }}
              {% if m.complex %} · {{ m.complex.name }}{% endif %}
              {% if m.building %} · {{ m.building }}동 {{ m.unit }}호{% endif %}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">관련 수업 (선택)</label>
          <select name="gx_class" class="form-select">
            <option value="">수업 무관</option>
            {% for c in classes %}
            <option value="{{ c.id }}">{{ c.name }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-4">
          <label class="form-label">내용 <span style="color:var(--rose);">*</span></label>
          <textarea name="content" class="form-control" rows="5"
            placeholder="쪽지 내용을 입력하세요." required></textarea>
        </div>
        <button type="submit" class="btn btn-gx w-100">
          <i class="fa-solid fa-paper-plane me-1"></i>쪽지 보내기
        </button>
      </form>
    </div>

    <!-- 최근 쪽지 목록 -->
    <div class="mt-4">
      <h6 style="font-size:0.85rem;font-weight:600;color:var(--stone);margin-bottom:0.8rem;">
        최근 받은 쪽지
      </h6>
      <a href="/messages/inbox/" class="btn btn-gx-outline w-100">
        <i class="fa-solid fa-inbox me-1"></i>전체 수신함 보기
      </a>
    </div>
  </div>
</div>
{% endblock %}
