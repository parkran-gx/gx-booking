{% extends 'base.html' %}
{% block title %}쪽지 보내기{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-6">
    <div class="card gx-card p-4">
      <h4 class="fw-bold mb-1"><i class="fa-solid fa-envelope me-2"></i>쪽지 보내기</h4>
      <p class="text-muted small mb-4">확인 후 연락처로 답변드립니다.</p>
      <form method="post">
        {% csrf_token %}
        {% if not request.user.is_authenticated %}
        <div class="mb-3">
          <label class="form-label fw-semibold">이름 <span class="text-danger">*</span></label>
          <input type="text" name="sender_name" class="form-control" placeholder="홍길동" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">연락처 <span class="text-danger">*</span></label>
          <input type="tel" name="sender_phone" class="form-control" placeholder="010-0000-0000" required>
        </div>
        {% endif %}
        <div class="mb-3">
          <label class="form-label fw-semibold">관련 수업 (선택)</label>
          <select name="gx_class" class="form-select">
            <option value="">선택 안함</option>
            {% for c in classes %}
            <option value="{{ c.id }}">{{ c.name }} ({{ c.get_days_display }} {{ c.start_time|time:"H:i" }})</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">내용 <span class="text-danger">*</span></label>
          <textarea name="content" class="form-control" rows="5" placeholder="문의 내용을 입력해주세요." required></textarea>
        </div>
        <button type="submit" class="btn btn-gx w-100">
          <i class="fa-solid fa-paper-plane me-1"></i>보내기
        </button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
