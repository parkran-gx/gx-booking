{% extends 'base.html' %}
{% block title %}공지 {% if notice %}수정{% else %}작성{% endif %}{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-lg-8">
    <a href="/notices/" class="btn btn-link ps-0 mb-3"><i class="fa-solid fa-arrow-left me-1"></i>목록으로</a>
    <div class="card gx-card p-4">
      <h4 class="fw-bold mb-4">공지 {% if notice %}수정{% else %}작성{% endif %}</h4>
      <form method="post">
        {% csrf_token %}
        <div class="mb-3">
          <label class="form-label fw-semibold">제목</label>
          <input type="text" name="title" class="form-control" value="{{ notice.title }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">관련 수업 (선택)</label>
          <select name="gx_class" class="form-select">
            <option value="">전체</option>
            {% for c in classes %}
            <option value="{{ c.id }}" {% if notice.gx_class_id == c.id %}selected{% endif %}>{{ c.name }} {{ c.start_time|time:"H:i" }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">내용</label>
          <textarea name="content" class="form-control" rows="8" required>{{ notice.content }}</textarea>
        </div>
        <div class="d-flex gap-3 mb-4">
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="is_pinned" id="pinned" {% if notice.is_pinned %}checked{% endif %}>
            <label class="form-check-label" for="pinned">상단 고정</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="checkbox" name="is_global" id="global" {% if notice.is_global %}checked{% endif %}>
            <label class="form-check-label" for="global">전체 공지</label>
          </div>
        </div>
        <button type="submit" class="btn btn-gx w-100">저장</button>
      </form>
    </div>
  </div>
</div>
{% endblock %}
